name: CI Payment Service

on:
  push:
    paths:
      - 'apps/services/payment-service/**'
      - 'packages/shared/**'
      - 'packages/contracts/**'

  pull_request:
    paths:
      - 'apps/services/payment-service/**'
      - 'packages/shared/**'
      - 'packages/contracts/**'

jobs:
  test:
    name: Payment Service
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pipeline Test
        run: |
          echo "Payment Service pipeline executada com sucesso."

      - name: Summary
        if: always()
        run: |
          echo "## Payment Service" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Verificação | Resultado |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Pipeline acionada | PASS |" >> "$GITHUB_STEP_SUMMARY"