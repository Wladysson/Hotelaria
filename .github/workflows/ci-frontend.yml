name: CI Frontend

on:
  push:
    paths:
      - 'apps/frontend/**'

  pull_request:
    paths:
      - 'apps/frontend/**'

jobs:
  test:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pipeline Test
        run: |
          echo "Frontend pipeline executada com sucesso."

      - name: Summary
        if: always()
        run: |
          echo "## Frontend" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Verificação | Resultado |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Pipeline acionada | PASS |" >> "$GITHUB_STEP_SUMMARY"