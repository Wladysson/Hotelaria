name: CI - Auth Service

on:
  push:
    branches:
      - main
      - develop
    paths:
      - "apps/services/auth-service/**"
      - "packages/shared/**"
      - "packages/contracts/**"
      - ".github/workflows/ci-auth-service.yml"

  pull_request:
    branches:
      - main
      - develop
    paths:
      - "apps/services/auth-service/**"
      - "packages/shared/**"
      - "packages/contracts/**"
      - ".github/workflows/ci-auth-service.yml"

permissions:
  contents: read
  security-events: write
  pull-requests: write

concurrency:
  group: auth-service-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SERVICE_PATH: apps/services/auth-service
  PYTHON_VERSION: "3.12"

jobs:

  quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Poetry
        run: |
          pip install poetry

      - name: Configure Poetry
        working-directory: ${{ env.SERVICE_PATH }}
        run: |
          poetry config virtualenvs.create true
          poetry config virtualenvs.in-project true

      - name: Install dependencies
        working-directory: ${{ env.SERVICE_PATH }}
        run: |
          poetry install --no-interaction --no-ansi

      - name: Ruff - Lint
        working-directory: ${{ env.SERVICE_PATH }}
        run: |
          poetry run ruff check src tests

      - name: Ruff - Format check
        working-directory: ${{ env.SERVICE_PATH }}
        run: |
          poetry run ruff format --check src tests

      - name: MyPy - Type checking
        working-directory: ${{ env.SERVICE_PATH }}
        run: |
          poetry run mypy src

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: quality

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Poetry
        run: |
          pip install poetry

      - name: Install dependencies
        working-directory: ${{ env.SERVICE_PATH }}
        run: |
          poetry install --no-interaction --no-ansi

      - name: Run unit tests
        working-directory: ${{ env.SERVICE_PATH }}
        run: |
          poetry run pytest \
            tests/unit \
            -v \
            --tb=short \
            --strict-markers \
            --strict-config \
            --disable-warnings \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=70

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: auth-service-coverage
          path: ${{ env.SERVICE_PATH }}/coverage.xml

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests

    services:

      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: auth_test
          POSTGRES_PASSWORD: auth_test
          POSTGRES_DB: auth_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U auth_test -d auth_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

      rabbitmq:
        image: rabbitmq:3-management-alpine
        ports:
          - 5672:5672
          - 15672:15672
        options: >-
          --health-cmd="rabbitmq-diagnostics -q ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Poetry
        run: |
          pip install poetry

      - name: Install dependencies
        working-directory: ${{ env.SERVICE_PATH }}
        run: |
          poetry install --no-interaction --no-ansi

      - name: Run database migrations
        working-directory: ${{ env.SERVICE_PATH }}
        env:
          DATABASE_URL: postgresql+asyncpg://auth_test:auth_test@localhost:5432/auth_test
        run: |
          poetry run alembic upgrade head

      - name: Run integration tests
        working-directory: ${{ env.SERVICE_PATH }}
        env:
          DATABASE_URL: postgresql+asyncpg://auth_test:auth_test@localhost:5432/auth_test
          RABBITMQ_URL: amqp://guest:guest@localhost:5672/
          ENVIRONMENT: test
        run: |
          poetry run pytest \
            tests/integration \
            -v \
            --tb=short \
            --strict-markers \
            --strict-config \
            --disable-warnings

  regression-tests:
    name: Regression Tests
    runs-on: ubuntu-latest
    needs: integration-tests

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Poetry
        run: |
          pip install poetry

      - name: Install dependencies
        working-directory: ${{ env.SERVICE_PATH }}
        run: |
          poetry install --no-interaction --no-ansi

      - name: Run regression suite
        working-directory: ${{ env.SERVICE_PATH }}
        run: |
          poetry run pytest \
            tests/regression \
            -v \
            --tb=short \
            --strict-markers \
            --strict-config \
            --disable-warnings

  security:
    name: Security Analysis
    runs-on: ubuntu-latest
    needs: quality

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        run: |
          pip install poetry

      - name: Install dependencies
        working-directory: ${{ env.SERVICE_PATH }}
        run: |
          poetry install --no-interaction --no-ansi

      - name: Bandit - Python security scan
        working-directory: ${{ env.SERVICE_PATH }}
        run: |
          poetry run bandit \
            -r src \
            -f json \
            -o bandit-report.json

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auth-service-bandit-report
          path: ${{ env.SERVICE_PATH }}/bandit-report.json

      - name: Dependency vulnerability scan
        working-directory: ${{ env.SERVICE_PATH }}
        run: |
          poetry run pip-audit

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: SonarQube Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  build:
    name: Build Service
    runs-on: ubuntu-latest
    needs:
      - unit-tests
      - integration-tests
      - regression-tests
      - security

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        working-directory: ${{ env.SERVICE_PATH }}
        run: |
          docker build \
            -t auth-service:${{ github.sha }} \
            .

      - name: Verify Docker image
        run: |
          docker image inspect auth-service:${{ github.sha }}

  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    if: always()
    needs:
      - quality
      - unit-tests
      - integration-tests
      - regression-tests
      - security
      - build

    steps:

      - name: Generate CI Summary
        run: |

          echo "# Auth Service - CI Summary" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "| Stage | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ needs.quality.result }}" = "success" ]; then
            echo "|  Code Quality | PASSED |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "|  Code Quality | FAILED |" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "${{ needs.unit-tests.result }}" = "success" ]; then
            echo "|  Unit Tests | PASSED |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "|  Unit Tests | FAILED |" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "${{ needs.integration-tests.result }}" = "success" ]; then
            echo "|  Integration Tests | PASSED |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "|  Integration Tests | FAILED |" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "${{ needs.regression-tests.result }}" = "success" ]; then
            echo "|  Regression Tests | PASSED |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "|  Regression Tests | FAILED |" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "${{ needs.security.result }}" = "success" ]; then
            echo "|  Security | PASSED |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "|  Security | FAILED |" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "${{ needs.build.result }}" = "success" ]; then
            echo "|  Docker Build | PASSED |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "|  Docker Build | FAILED |" >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ \
            "${{ needs.quality.result }}" = "success" ] && \
            [ "${{ needs.unit-tests.result }}" = "success" ] && \
            [ "${{ needs.integration-tests.result }}" = "success" ] && \
            [ "${{ needs.regression-tests.result }}" = "success" ] && \
            [ "${{ needs.security.result }}" = "success" ] && \
            [ "${{ needs.build.result }}" = "success" ]; then

            echo "## AUTH SERVICE APPROVED" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "All mandatory CI checks passed successfully." >> "$GITHUB_STEP_SUMMARY"

          else

            echo "## AUTH SERVICE REJECTED" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "One or more mandatory CI checks failed." >> "$GITHUB_STEP_SUMMARY"

            exit 1

          fi