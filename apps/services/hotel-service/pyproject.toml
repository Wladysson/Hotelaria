[build-system]
requires = [
    "setuptools>=75.0",
    "wheel"
]
build-backend = "setuptools.build_meta"

[project]
name = "hotel-service"
version = "1.0.0"
description = "Serviço de catálogo, hotéis, quartos, cidades, comodidades e disponibilidade da plataforma de reservas hoteleiras."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

authors = [
    { name = "Hotel Booking Platform" }
]

dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.34,<1.0",
    "sqlalchemy>=2.0,<3.0",
    "asyncpg>=0.30,<1.0",
    "alembic>=1.15,<2.0",
    "pydantic>=2.10,<3.0",
    "pydantic-settings>=2.7,<3.0",
    "redis>=5.2,<7.0",
    "httpx>=0.28,<1.0",
    "python-multipart>=0.0.20,<1.0",
    "orjson>=3.10,<4.0"
]

[project.optional-dependencies]
test = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.25,<1.0",
    "pytest-cov>=6.0,<7.0",
    "aiosqlite>=0.20,<1.0"
]

dev = [
    "ruff>=0.9,<1.0",
    "black>=25.0,<26.0",
    "mypy>=1.14,<2.0"
]

[tool.setuptools]
packages = [
    "src"
]

[tool.pytest.ini_options]
pythonpath = [
    "."
]

asyncio_mode = "auto"

testpaths = [
    "tests"
]

addopts = [
    "-v",
    "--strict-markers",
    "--strict-config"
]

[tool.ruff]
line-length = 100
target-version = "py312"

exclude = [
    ".git",
    ".venv",
    "__pycache__",
    ".pytest_cache",
    "alembic/versions"
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B"
]

ignore = [
    "B008"
]

[tool.black]
line-length = 100
target-version = [
    "py312"
]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true