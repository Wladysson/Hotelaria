services:

  postgres:
    image: postgres:17-alpine
    container_name: hotel-postgres

    environment:
      POSTGRES_DB: hotel
      POSTGRES_USER: hotel
      POSTGRES_PASSWORD: hotel

    ports:
      - "5439:5432"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U hotel -d hotel"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

    volumes:
      - hotel-postgres-data:/var/lib/postgresql/data

    networks:
      - hotel-network


  redis:
    image: redis:7-alpine
    container_name: hotel-redis

    command:
      [
        "redis-server",
        "--appendonly",
        "yes"
      ]

    ports:
      - "6380:6379"

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

    volumes:
      - hotel-redis-data:/data

    networks:
      - hotel-network


  hotel:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: hotel-service

    environment:
      ENVIRONMENT: development

      APP_NAME: Hotel Service
      APP_VERSION: 1.0.0

      API_V1_PREFIX: /api/v1

      DATABASE_URL: postgresql+asyncpg://hotel:hotel@postgres:5432/hotel

      REDIS_URL: redis://redis:6379/0

      CORS_ORIGINS: http://localhost:5173
      CORS_ALLOW_CREDENTIALS: "true"
      CORS_ALLOW_METHODS: GET,POST,PUT,PATCH,DELETE,OPTIONS
      CORS_ALLOW_HEADERS: "*"

    ports:
      - "8000:8000"

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

    command:
      [
        "uvicorn",
        "src.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000"
      ]

    networks:
      - hotel-network


volumes:
  hotel-postgres-data:
    name: hotel-postgres-data

  hotel-redis-data:
    name: hotel-redis-data


networks:
  hotel-network:
    name: hotel-network
    driver: bridge