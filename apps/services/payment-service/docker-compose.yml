services:

  payment-postgres:
    image: postgres:17-alpine
    container_name: payment-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: payment
      POSTGRES_USER: payment
      POSTGRES_PASSWORD: payment

    ports:
      - "5440:5432"

    volumes:
      - payment_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U payment -d payment"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

    networks:
      - payment-network


  payment-service:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: payment-service
    restart: unless-stopped

    environment:
      APP_NAME: "Bank Payment Service"
      APP_VERSION: "1.0.0"
      ENVIRONMENT: "docker"
      DEBUG: "false"

      DATABASE_URL: "postgresql+asyncpg://payment:payment@payment-postgres:5432/payment"

      JWT_SECRET_KEY: "${JWT_SECRET_KEY:-change-me-in-production}"
      JWT_ALGORITHM: "HS256"
      ACCESS_TOKEN_EXPIRE_MINUTES: "15"

      STRIPE_SECRET_KEY: "${STRIPE_SECRET_KEY:-}"
      STRIPE_WEBHOOK_SECRET: "${STRIPE_WEBHOOK_SECRET:-}"

      PAYPAL_CLIENT_ID: "${PAYPAL_CLIENT_ID:-}"
      PAYPAL_CLIENT_SECRET: "${PAYPAL_CLIENT_SECRET:-}"
      PAYPAL_BASE_URL: "${PAYPAL_BASE_URL:-https://api-m.sandbox.paypal.com}"

      PAYMENT_TIMEOUT_SECONDS: "${PAYMENT_TIMEOUT_SECONDS:-10}"
      PAYMENT_MAX_RETRIES: "${PAYMENT_MAX_RETRIES:-3}"

      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:5173}"
      CORS_ALLOW_CREDENTIALS: "true"
      CORS_ALLOW_METHODS: "GET,POST,PUT,PATCH,DELETE,OPTIONS"
      CORS_ALLOW_HEADERS: "*"

    ports:
      - "8085:8000"

    depends_on:
      payment-postgres:
        condition: service_healthy

    networks:
      - payment-network


volumes:
  payment_postgres_data:


networks:
  payment-network:
    driver: bridge