[alembic]
script_location = %(here)s/alembic

prepend_sys_path = .

path_separator = os

sqlalchemy.url = postgresql+asyncpg://payment:payment@localhost:5440/payment

file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(rev)s_%%(slug)s

timezone = UTC

truncate_slug_length = 40

revision_environment = false

compare_type = true

compare_server_default = true


[post_write_hooks]


[loggers]
keys = root,sqlalchemy,alembic


[handlers]
keys = console


[formatters]
keys = generic


[logger_root]
level = WARN
handlers = console


[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine


[logger_alembic]
level = INFO
handlers =
qualname = alembic


[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic


[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s