services:

  postgres-test:
    image: postgres:17-alpine
    container_name: auth-postgres-test

    environment:
      POSTGRES_DB: auth_test
      POSTGRES_USER: auth_test
      POSTGRES_PASSWORD: auth_test

    ports:
      - "5438:5432"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U auth_test -d auth_test"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

    tmpfs:
      - /var/lib/postgresql/data

    networks:
      - auth-test


  auth-test:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: auth-service-test

    environment:
      ENVIRONMENT: test

      DATABASE_URL: postgresql+asyncpg://auth_test:auth_test@postgres-test:5432/auth_test

      JWT_SECRET_KEY: test-secret-key-change-me
      JWT_ALGORITHM: HS256

      ACCESS_TOKEN_EXPIRE_MINUTES: 15
      REFRESH_TOKEN_EXPIRE_DAYS: 7

      LOGIN_MAX_ATTEMPTS: 5
      LOGIN_LOCKOUT_MINUTES: 15

      CORS_ORIGINS: http://localhost:5173
      CORS_ALLOW_CREDENTIALS: "true"
      CORS_ALLOW_METHODS: GET,POST,PUT,PATCH,DELETE,OPTIONS
      CORS_ALLOW_HEADERS: "*"

    depends_on:
      postgres-test:
        condition: service_healthy

    command:
      [
        "pytest",
        "-v",
        "tests/unit",
        "tests/integration"
      ]

    networks:
      - auth-test


networks:
  auth-test:
    driver: bridge