[build-system]
requires = [
    "setuptools>=75.0"
]
build-backend = "setuptools.build_meta"


[project]
name = "auth-service"
version = "1.0.0"
description = "Authentication and authorization service"
requires-python = ">=3.12"
dependencies = []


[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = [
    "tests/unit",
    "tests/integration",
    "tests/e2e",
]
asyncio_mode = "auto"
addopts = "-ra"


[tool.ruff]
line-length = 79
target-version = "py312"

exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    ".pytest_cache",
    ".mypy_cache",
    "alembic/versions",
]


[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]

ignore = [
    "B008",
]


[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"